# Fly.io config: one small always-on machine. See README "Deploy to Fly.io".
app = "vocab-booster-change-me"   # app names are global: pick your own
primary_region = "ams"            # Amsterdam; Warsaw isn't offered

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SYNC_CRON = "0 4 * * *"         # daily Google Sheet sync
  SYNC_TIMEZONE = "Europe/Kyiv"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: the daily sync runs inside the server, and the app opens instantly.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "60s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
